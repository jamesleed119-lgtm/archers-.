<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ragdoll Archers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/images-classroom-sources/ok@main/style.css" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-container {
        width: 942px;
        height: 611px;
        max-width: 100vw;
        max-height: 100vh;
        position: relative;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }

      #loading-cover {
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, 80vw);
        text-align: center;
      }

      #unity-logo img {
        width: 160px;
        height: auto;
        margin-bottom: 18px;
      }

      .progress-spinner-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .spinner-left img,
      .spinner-right img {
        width: 26px;
        height: 26px;
        display: block;
      }

      #unity-progress-bar-empty {
        position: relative;
        width: 220px;
        height: 16px;
        border-radius: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.18);
      }

      #unity-progress-bar-full {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: linear-gradient(90deg, #ff9f1c, #ffd166);
      }


    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="942" height="611" style="cursor: default;"></canvas>
    </div>

    <div id="loading-cover" style="display: none;">
      <div id="unity-loading-bar">
        <div id="unity-logo">
          <img src="https://cdn.jsdelivr.net/gh/ertemr33/qaza@main/new.png" alt="Logo" />
        </div>
        <div class="progress-spinner-container">
          <div class="spinner-left"><img src="https://cdn.jsdelivr.net/gh/images-classroom-sources/ok@main/spinner.png" alt="spinner" /></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full" style="width: 100%;"></div>
          </div>
          <div class="spinner-right"><img src="https://cdn.jsdelivr.net/gh/images-classroom-sources/ok@main/spinner.png" alt="spinner" /></div>
        </div>
      </div>
    </div>

    <script>
      const buildUrl = 'https://cdn.jsdelivr.net/gh/images-classroom-sources/ok@main/Build';
      const loaderUrl = buildUrl + '/v111.loader.js';
      const config = {
        dataUrl: buildUrl + '/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb',
        frameworkUrl: buildUrl + '/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb',
        codeUrl: buildUrl + '/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Ericetto',
        productName: 'Ragdoll Archers',
        productVersion: '0.1'
      };

      const container = document.querySelector('#unity-container');
      const canvas = document.querySelector('#unity-canvas');
      const loadingCover = document.querySelector('#loading-cover');
      const progressBarEmpty = document.querySelector('#unity-progress-bar-empty');
      const progressBarFull = document.querySelector('#unity-progress-bar-full');

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = 'unity-mobile';
      }

      loadingCover.style.display = '';

      const unityLoader = document.createElement('script');
      unityLoader.src = loaderUrl;
      unityLoader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarEmpty.style.display = '';
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingCover.style.display = 'none';
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(unityLoader);

      document.addEventListener('pointerdown', () => {
        container.focus();
        window.focus();
        canvas.focus();
      });
    </script>
  </body>
</html>
